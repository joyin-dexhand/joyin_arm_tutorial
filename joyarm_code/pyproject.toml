[build-system] # 显式声明构建后端，避免 pip/uv 隐式回退旧版 setuptools
build-backend = "setuptools.build_meta"

[project]
name = "joyarm_code"
version = "0.1.0"
description = "sdk-ros2-chapt code for JoyArm"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "meshcat>=0.3.2",
    "pin>=3.9.0",
    "pyyaml>=6.0",
    "matplotlib>=3.10.0",
    "pyside6>=6.5.2",
    "numpy>=2.0.1",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find] # 平铺布局多顶层目录，显式只打包核心 SDK
include = ["joyarm_core*"]

[dependency-groups]
dev = ["pytest>=8"]
