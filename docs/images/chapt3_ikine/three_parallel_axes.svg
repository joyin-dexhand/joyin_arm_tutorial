<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="连续三轴平行构型与两类构型解耦对照">
<title>连续三轴平行构型（JoyArm）与两类解耦对照</title>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#263442}.title{font-size:25px;font-weight:700}.small{font-size:19px}.comp{font-size:16px}.blue{fill:#236ab0}.red{fill:#dc493a}</style>
<rect id="bg" width="100%" height="100%" rx="16" fill="#fff"/>
<g inkscape:groupmode="layer" inkscape:label="标题与面板" id="layer-frame">
<text x="35" y="42" class="title" id="main-title">连续三轴平行（JoyArm）与两类构型解耦对照</text>
<rect x="28" y="64" width="459" height="392" rx="12" fill="#f4f7fa" id="panel-a"/>
<rect x="515" y="64" width="460" height="392" rx="12" fill="#f4f7fa" id="panel-b"/>
<text x="35" y="484" class="small" id="caption">左：第 2、3、4 轴平行，臂部共面；右：球形腕与三轴平行的解耦方式对比。</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="① 三轴平行构型" id="layer-b">
<text id="t-a" x="58.0" y="100.0" class="small">① 连续三轴平行（JoyArm）</text><line x1="135.3" y1="282.3" x2="203.3" y2="322.3" stroke="#c9a227" stroke-width="3" stroke-dasharray="6 5"/><line x1="164.7" y1="191.9" x2="232.7" y2="231.9" stroke="#c9a227" stroke-width="3" stroke-dasharray="6 5"/><line x1="224.3" y1="151.7" x2="292.3" y2="191.7" stroke="#c9a227" stroke-width="3" stroke-dasharray="6 5"/><line id="l1" x1="120.0" y1="395.0" x2="169.3" y2="302.3" stroke="#4a5b6d" stroke-width="11" stroke-linecap="round"/><line id="l2" x1="169.3" y1="302.3" x2="198.7" y2="211.9" stroke="#7d8ea0" stroke-width="11" stroke-linecap="round"/><line id="l3" x1="198.7" y1="211.9" x2="258.3" y2="171.7" stroke="#8fa0b1" stroke-width="11" stroke-linecap="round" stroke-dasharray="8 6"/><circle id="j1" cx="120.0" cy="395.0" r="12" fill="white" stroke="#334155" stroke-width="3"/><circle id="j2" cx="169.3" cy="302.3" r="12" fill="white" stroke="#334155" stroke-width="3"/><circle id="j3" cx="198.7" cy="211.9" r="12" fill="white" stroke="#334155" stroke-width="3"/><circle id="j4" cx="258.3" cy="171.7" r="12" fill="white" stroke="#334155" stroke-width="3"/><circle id="wrist" cx="258.3" cy="171.7" r="9" fill="#dc493a" stroke="#b3382c" stroke-width="3"/><text x="94.0" y="427.0" class="small">基座 O</text><text x="99.3" y="288.3" class="small">关节 2</text><text x="214.7" y="205.9" class="small">关节 3</text><text x="272.3" y="175.7" class="small">关节 4</text><text id="lbl-wrist" x="250.3" y="149.7" class="small red">腕心</text><text id="note" x="58.0" y="132.0" class="comp" fill="#a8842a">关节轴 Z₂ ∥ Z₃ ∥ Z₄（黄色虚线）</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="② 解耦对照" id="layer-c">
<text id="t-b" x="560.0" y="100.0" class="small">② 两类构型的解耦对照</text><rect x="560" y="130" width="440" height="128" rx="10" fill="#fff" stroke="#236ab0" stroke-width="2.5"/><text x="580.0" y="162.0" class="small" fill="#236ab0">球形腕（§3）</text><text x="580.0" y="192.0" class="comp" fill="#5a6b7a">末三轴交于一点 → 前 3 轴定腕心</text><text x="580.0" y="220.0" class="comp" fill="#5a6b7a">后 3 轴正交 → ZYZ 欧拉角定姿态</text><rect x="560" y="278" width="440" height="128" rx="10" fill="#fff" stroke="#334155" stroke-width="2.5"/><text x="580.0" y="310.0" class="small" fill="#334155">三轴平行（§4，JoyArm）</text><text x="580.0" y="340.0" class="comp" fill="#5a6b7a">Z₂∥Z₃∥Z₄ → 合角 φ 把位置压到平面</text><text x="580.0" y="368.0" class="comp" fill="#5a6b7a">后 2 轴相交 → 平面内解出 q₅,q₆</text>
</g>
</svg>