<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-label="关节需要同时支撑自重和工件">
<defs><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#dc493a"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#236ab0"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#263442}.title{font-size:25px;font-weight:700}.small{font-size:17px}.blue{fill:#236ab0}.red{fill:#dc493a}</style><rect width="100%" height="100%" rx="16" fill="#fff"/>
<text x="35" y="40" class="title">关节需要同时支撑自重和工件</text><text x="35" y="76" class="small">水平伸展的简化模型：各重力均使连杆绕 O 顺时针转动。</text><line x1="100" y1="195" x2="850" y2="195" stroke="#8393a2" stroke-width="14" stroke-linecap="round"/><circle cx="100" cy="195" r="15" fill="white" stroke="#334155" stroke-width="3"/><circle cx="100" cy="195" r="4" fill="#334155"/><text x="62" y="157" class="">关节轴 O</text><circle cx="330" cy="195" r="13" fill="#d28a27"/><text x="260" y="145" class="">下游连杆与模组</text><line x1="330" y1="211" x2="330" y2="285" stroke="#d28a27" stroke-width="3" marker-end="url(#red)"/><text x="344" y="258" class="">m₁g</text><line x1="330" y1="290" x2="330" y2="423" stroke="#8393a2" stroke-width="2" stroke-dasharray="5 5"/><circle cx="610" cy="195" r="13" fill="#d28a27"/><text x="540" y="145" class="">夹爪与转接件</text><line x1="610" y1="211" x2="610" y2="285" stroke="#d28a27" stroke-width="3" marker-end="url(#red)"/><text x="624" y="258" class="">m₂g</text><line x1="610" y1="290" x2="610" y2="423" stroke="#8393a2" stroke-width="2" stroke-dasharray="5 5"/><circle cx="850" cy="195" r="13" fill="#dc493a"/><text x="780" y="145" class="">工件</text><line x1="850" y1="211" x2="850" y2="285" stroke="#dc493a" stroke-width="3" marker-end="url(#red)"/><text x="864" y="258" class="">mg</text><line x1="850" y1="290" x2="850" y2="423" stroke="#8393a2" stroke-width="2" stroke-dasharray="5 5"/><line x1="100" y1="218" x2="100" y2="423" stroke="#8393a2" stroke-width="2" stroke-dasharray="5 5"/><line x1="100" y1="325" x2="330" y2="325" stroke="#236ab0" stroke-width="2" marker-start="url(#blue)" marker-end="url(#blue)"/><text x="175.0" y="313" class="blue">d₁</text><line x1="100" y1="369" x2="610" y2="369" stroke="#236ab0" stroke-width="2" marker-start="url(#blue)" marker-end="url(#blue)"/><text x="315.0" y="357" class="blue">d₂</text><line x1="100" y1="413" x2="850" y2="413" stroke="#236ab0" stroke-width="2" marker-start="url(#blue)" marker-end="url(#blue)"/><text x="435.0" y="401" class="blue">d</text><text x="45" y="470" class="">自重力矩：τself = m₁gd₁ + m₂gd₂</text><text x="570" y="470" class="">工件力矩：τload = mgd</text><text x="45" y="509" class="small">图中每个点代表一组部件的等效质心；自重项不含工件，避免重复计算。</text></svg>