site_name: JoyArm 机械臂教程
theme:
  name: material
  language: zh # 开启中文支持
  features:
    - navigation.expand # 左侧目录默认全部展开（使用篇/基础篇/进阶篇/应用篇 同时展开）
  palette: # 亮/暗模式切换，点击左上角圆形按钮切换，记忆用户选择
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

# Mermaid 流程图渲染（markdown 中 ```mermaid 代码块会自动转为图形）
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# 额外样式表（Mermaid 节点主题自适应配色等）
extra_css:
  - stylesheets/mermaid.css
  - stylesheets/extra.css

# 定义左侧目录结构与跳转
nav:
  - 首页: index.md
  - 使用篇:
      - 快速上手: chapter1_1.md
      - 关节电机: chapter1_2.md
      - 六轴整臂: chapter1_3.md
      - 两指夹爪: chapter1_4.md
  - 基础篇:
      - 第一章 机器人与机械臂初识: chapter2_1.md
      - 第二章 空间位姿与位置正运动学: chapter2_2.md
      - 第三章 位置逆运动学: chapter2_3.md
      - 第四章 速度运动学与静力学: chapter2_4.md
      - 第五章 轨迹生成: chapter2_5.md
      - 第六章 运动控制: chapter2_6.md
  - 进阶篇:
      - 第七章 构型与结构设计、关节选型、装配体URDF导出: chapter3_1.md
      - 第八章 动力学及控制实现: chapter3_2.md
      - 第九章 力控制: chapter3_3.md
      - 第十章 ROS2: chapter3_4.md
  - 应用篇:
      - 第十一章 状态监测与安全软防护: chapter4_1.md
      - 第十二章 示教和遥操作: chapter4_2.md
      - 第十三章 末端执行器统一接口与自识别: chapter4_3.md
      - 第十四章 用户接口: chapter4_4.md
      - 第十五章 JoyArm 综合项目实践: chapter4_5.md
