site_name: JoyArm 机械臂教程
theme:
  name: material
  language: zh # 开启中文支持
  features:
    - navigation.expand # 左侧目录默认全部展开
  palette: # 亮/暗模式切换，点击左上角圆形按钮切换，记忆用户选择
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

# Mermaid 流程图渲染（markdown 中 ```mermaid 代码块会自动转为图形）
# MathJax 数学公式渲染（$...$ 行内、$$...$$ 行间）
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format:
            !!python/name:pymdownx.superfences.fence_code_format


  - pymdownx.arithmatex: # 数学公式：$...$ 与 $$...$$ 自动交给 MathJax 渲染
      generic: true

# 额外样式表（Mermaid 节点主题自适应配色等）
extra_css:
  - stylesheets/mermaid.css
  - stylesheets/extra.css

# MathJax 脚本：先加载本地配置，再加载 MathJax 本体
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# 定义左侧目录结构与跳转
nav:
  - 首页: index.md
  - 使用篇:
      - 快速上手: quickstart.md
      - 关节电机: joint_motor.md
      - 六轴整臂: arm_6dof.md
      - 两指夹爪: gripper.md
  - 基础篇:
      - 第一章 机器人与机械臂初识: chapt1_intro.md
      - 第二章 空间位姿与位置正运动学: chapt2_fkine.md
      - 第三章 位置逆运动学: chapt3_ikine.md
      - 第四章 速度运动学与静力学: chapt4_jacobian.md
      - 第五章 轨迹生成: chapt5_trajectory.md
      - 第六章 运动控制: chapt6_control.md
  - 进阶篇:
      - 第七章 构型结构设计与URDF导出: chapt7_urdf.md
      - 第八章 动力学及控制: chapt8_dyn.md
      - 第九章 力控制: chapt9_force.md
      - 第十章 ROS2: chapt10_ros2.md
  - 应用篇:
      - 第十一章 状态监测与安全软防护: chapt11_safety.md
      - 第十二章 示教和遥操作: chapt12_teleop.md
      - 第十三章 末端执行器: chapt13_endeffector.md
      - 第十四章 用户接口: chapt14_ui.md
      - 第十五章 JoyArm 综合实践项目: chapt15_project.md
